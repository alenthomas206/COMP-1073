<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mitsubishi Eclipse Remix - Toy Car Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Brian's Mitsubishi Eclipse Remix – Fast & Furious</h1>

<div class="car-container">

    <div class="left">
        <button id="leftArrow" class="arrow">&#10094;</button>

        <img id="carImage" 
             src="img1.jpg"
             class="car-image">

        <button id="rightArrow" class="arrow">&#10095;</button>
    </div>


    <div class="right">
        <h2>Car Details</h2>
        <div id="detailsBox" class="details"></div>

        <button id="spoilerBtn" class="spoilerButton">
            Customize Spoiler
        </button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
