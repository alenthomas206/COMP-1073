<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>Smoothie Machine</title>
</head>
<body>
    <h1>Smoothie Machine</h1>
    <form id="smoothieForm">

        <label>
            Choose Base:
            <select id="base">
                <option value="Milk">Milk</option>
                <option value="Almond Milk">Almond Milk</option>
                <option value="Yogurt">Yogurt</option>
            </select>
        </label>

        <label>
            Size:
            <select id="size">
                <option value="Small">Small</option>
                <option value="Medium">Medium</option>
                <option value="Large">Large</option>
            </select>
        </label>

        <label>Ingredients:</label>
        <div class="ingredients">
            <label><input type="checkbox" value="Banana"> Banana</label>
            <label><input type="checkbox" value="Strawberry"> Strawberry</label>
            <label><input type="checkbox" value="Mango"> Mango</label>
        </div>
        <label>
            Sweetener:
            <select id="sweetener">
                <option value="Honey">Honey</option>
                <option value="Sugar">Sugar</option>
                <option value="Stevia">Stevia</option>
            </select>
        <button type="button" id="orderBtn">Order Smoothie</button>

        <button type="button" id="resetBtn" class="secondary-btn">Order Again</button>
    </form>

    <!-- Output -->
    <div id="output"></div>  

    <script src="script.js"></script>
</body>
</html>
